# yaml-language-server: $schema=../../packages/blog/schema/site.schema.json

themeConfig:
  sidebarLogoSrc: '/img/sidebar-logo.jpg'
  sidebarLogoHeight: 180
  # editLink pattern is auto-generated from `repo` (set in config.ts).
  donate:
    url: 'page/donate'
  publisher:
    logo: '/img/sidebar-logo.jpg'
  nav:
    donate: true
    socialLinks:
      - icon: 'fa6-brands:github-alt'
        link: '${theme.repo}'
        desktopOnly: true
  sidebar:
    popular: true
    recent: true
    archive: true
    authors: true
    tags: true
    donate: true
    rssFeed: true
    atomFeed: true
    socialLinks:
      - icon: 'fa6-brands:github'
        link: '${theme.repo}'
  footer:
    links:
      - text: 'About'
        href: 'page/about'
