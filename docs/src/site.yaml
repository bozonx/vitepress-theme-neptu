# yaml-language-server: $schema=../../packages/blog/schema/site.schema.json

themeConfig:
  sidebarLogoSrc: '/img/sidebar-logo.jpg'
  sidebarLogoHeight: 158
  editLink:
    pattern: 'https://github.com/your-org/your-blog/edit/main/src/:path'
  donate:
    url: 'page/donate'
  publisher:
    logo: 'https://myblog.org/logo.png'
  nav:
    donate: true
    socialLinks:
      - icon: 'fa6-brands:github-alt'
        link: '${theme.repo}'
        desktopOnly: true
  sidebar:
    popular: true
    recent: true
    archive: true
    authors: true
    tags: true
    donate: true
    rssFeed: true
    atomFeed: true
    socialLinks:
      - icon: 'fa6-brands:github'
        link: '${theme.repo}'
  footer:
    links:
      - text: 'About'
        href: 'page/about'
