# yaml-language-server: $schema=../../packages/blog/schema/site.schema.json

themeConfig:
  sidebarLogoSrc: '/img/sidebar-logo.jpg'
  sidebarLogoHeight: 180
  # Demo only: production blogs normally choose one theme and omit the pickers.
  colorPicker: true
  stylePicker: true
  # GitHub repository URL — used by edit-link auto-generation and `${theme.repo}` template references.
  repo: 'https://github.com/bozonx/vitepress-theme-neptu'
  donate:
    url: 'page/donate'
  publisher:
    logo: '/img/sidebar-logo.jpg'
  sidebar:
    popular: true
    recent: true
    archive: true
    authors: true
    tags: true
    donate: true
    rssFeed: true
    atomFeed: true
    socialLinks:
      - icon: 'fa6-brands:github'
        link: '${theme.repo}'
  nav:
    donate: true
    socialLinks:
      - icon: 'fa6-brands:github-alt'
        link: '${theme.repo}'
        desktopOnly: true
