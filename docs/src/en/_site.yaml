# yaml-language-server: $schema=../../../packages/blog/schema/site.schema.json
lang: 'en-US'
title: 'Neptu Blog Theme'
description: 'Example Blog Description'

themeConfig:
  home:
    hero:
      title: 'Neptu Blog Theme'
      description: 'A living demo — every page documents a feature of the theme'
      image:
        src: '/img/sidebar-logo.webp'
        alt: 'Example blog logo'
      actions:
        - text: '${t.toBlog}'
          href: 'recent/1'
          primary: true
        - text: 'Read the guide'
          href: 'post/welcome'
  editLink:
    text: 'Edit this page on GitHub'
  donate:
    postDonateCall: 'If you find this blog useful, consider supporting it.'
  nav:
    links:
      - text: 'Some link'
        href: 'https://example.org/'
        icon: 'solar:document-linear'
        desktopOnly: true
  sidebar:
    bottomLinks:
      - { header: '${t.links.links}' }
      - text: 'Our YouTube channel'
        href: 'https://www.youtube.com/'
        icon: '${theme.youtubeIcon}'
      - text: 'We in social media'
        href: 'page/links'
        icon: 'fa6-solid:share-nodes'
  footer:
    message: 'Copying allowed only with a link to the source.'
    copyright: 'Copyright © 2026-present Your Name.'
    links:
      - text: '${t.links.aboutBlog}'
        href: 'page/about'
