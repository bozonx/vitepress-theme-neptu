# yaml-language-server: $schema=../../../packages/blog/schema/site.schema.json
lang: 'ru-RU'
title: 'Тема Neptu для блога'
description: 'Демонстрационный блог темы vitepress-theme-neptu'

themeConfig:
  home:
    hero:
      title: 'Тема Neptu для блога'
      description: 'Блог на VitePress, который можно запустить за пять минут'
      image:
        src:
          light: '/img/home-logo-light.webp'
          dark: '/img/home-logo-dark.webp'
        alt: 'Логотип демо-блога'
      actions:
        - text: 'Начать за 5 минут'
          href: 'post/getting-started'
          primary: true
        - text: 'Содержание руководства'
          href: 'page/contents'
  editLink:
    text: 'Редактировать эту страницу на GitHub'
  donate:
    postDonateCall: 'Если блог оказался полезным — поддержите его.'
  nav:
    links:
      - text: 'Содержание'
        href: 'page/contents'
        icon: 'fa6-solid:list-ul'
        desktopOnly: true
  sidebar:
    links:
      - text: 'Содержание руководства'
        href: 'page/contents'
        icon: 'fa6-solid:list-ul'
    bottomLinks:
      - { header: '${t.links.links}' }
      - text: 'Наш YouTube-канал'
        href: 'https://www.youtube.com/'
        icon: '${theme.youtubeIcon}'
      - text: 'Мы в соцсетях'
        href: 'page/links'
        icon: 'fa6-solid:share-nodes'
  footer:
    message: 'Копирование разрешено только со ссылкой на источник.'
    copyright: 'Copyright © 2026-present Your Name.'
    links:
      - text: '${t.links.aboutBlog}'
        href: 'page/about'
      - text: 'Содержание'
        href: 'page/contents'
