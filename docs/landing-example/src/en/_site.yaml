# yaml-language-server: $schema=../../../../packages/blog/schema/site.schema.json

lang: 'en-US'
title: 'Neptu Landing'
description: 'A modern landing page theme for VitePress — SEO-first, i18n-ready, fully typed.'

themeConfig:
  publisher:
    name: 'Neptu'
    url: '${config.siteUrl}/${localeIndex}'
    logo: '${config.siteUrl}/img/home-logo.webp'

  # VitePress native sidebar (keyed by section name).
  # Template substitution and locale-prefixing are applied by loadSiteLocale.
  sidebar:
    doc:
      - text: 'Guide'
        items:
          - text: 'Introduction'
            link: ''
          - text: 'Blocks'
            link: 'blocks'
          - text: 'Theming'
            link: 'theming'
          - text: 'Page as data'
            link: 'yaml-mode'
          - text: 'About'
            link: 'about'
