<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neptu — VitePress Themes</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        font-size: 1.125rem;
        color: #94a3b8;
        margin-bottom: 3rem;
      }

      .links {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .links a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 2rem;
        border-radius: 0.75rem;
        font-size: 1.125rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .links a:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
      }

      .links a.blog {
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        color: #fff;
      }

      .links a.landing {
        background: linear-gradient(135deg, #6366f1, #a855f7);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Neptu</h1>
      <p class="subtitle">VitePress Themes</p>
      <div class="links">
        <a class="blog" href="blog/">Blog Theme</a>
        <a class="landing" href="landing/">Landing Theme</a>
      </div>
    </div>
  </body>
</html>
