# yaml-language-server: $schema=../../../../packages/blog/schema/site.schema.json

lang: 'en-US'
title: 'Neptu Landing'
description: 'A modern landing page theme for VitePress — SEO-first, i18n-ready, fully typed.'

themeConfig:
  # VitePress native sidebar (keyed by section name).
  # Template substitution and locale-prefixing are applied by loadSiteLocale.
  sidebar:
    doc:
      - text: 'Guide'
        items:
          - text: 'Introduction'
            link: ''
          - text: 'Blocks'
            link: 'blocks'
          - text: 'Theming'
            link: 'theming'
          - text: 'Page as data'
            link: 'yaml-mode'
          - text: 'About'
            link: 'about'

  nav:
    - text: '📖 Docs'
      link: '/${localeIndex}/doc'
    - text: '🧩 Blocks'
      link: '/${localeIndex}/doc/blocks'
    - text: '🎨 Theming'
      link: '/${localeIndex}/doc/theming'
    - text: '📢 Social media'
      link: '/${localeIndex}/page/links'

  footer:
    message: 'Copying is allowed only with a link to the source.'
    copyright: 'Copyright © 2026-present Neptu'
