# yaml-language-server: $schema=../../../../packages/blog/schema/categories.schema.json

# Реестр категорий этой локали — единственное место, где категории описаны.
# Посты ссылаются на категорию по `id`: `category: getting-started`.
#
# `id` одинаков во всех локалях: именно он связывает /ru/categories/... и
# /en/categories/..., чтобы работал переключатель языка.
# `slug` по умолчанию равен `id` — задавайте его, только если нужен свой URL
# (см. `writing` ниже).

- id: 'getting-started'
  name: 'Начало работы'

- id: 'configuration'
  name: 'Настройка'

# Локализованный URL: /ru/categories/kontent/1 против /en/categories/writing/1.
# Переключатель языка всё равно находит соответствие — по общему `id`.
- id: 'writing'
  name: 'Контент'
  slug: 'kontent'

- id: 'media'
  name: 'Медиа'

- id: 'seo'
  name: 'SEO'

- id: 'i18n'
  name: 'Мультиязычность'

- id: 'integration'
  name: 'Интеграция'

- id: 'advanced'
  name: 'Продвинутое'

- id: 'neptu-deep'
  name: 'Углубляемся в тему Neptu'
