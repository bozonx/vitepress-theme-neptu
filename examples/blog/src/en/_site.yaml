# yaml-language-server: $schema=../../../../packages/blog/schema/site.schema.json
lang: 'en-US'
title: 'Neptu Blog Theme'
description: 'Demo blog for the vitepress-theme-neptu theme'

themeConfig:
  home:
    hero:
      title: 'Neptu Blog Theme'
      description: 'A VitePress blog you can launch in five minutes'
      image:
        light: '/img/home-logo-light.webp'
        dark: '/img/home-logo-dark.webp'
        alt: 'Demo blog logo'
      actions:
        - text: 'Get started in 5 minutes'
          href: 'posts/getting-started'
          primary: true
        - text: 'Table of contents'
          href: 'pages/contents'
  editLink:
    text: 'Edit this page on GitHub'
  donate:
    postDonateCall: 'If you find this blog useful, consider supporting it.'
  nav:
    links:
      - text: 'Contents'
        href: 'pages/contents'
        icon: 'fa6-solid:list-ul'
        desktopOnly: true
  sidebar:
    links:
      - text: 'Table of contents'
        href: 'pages/contents'
        icon: 'fa6-solid:list-ul'
    bottomLinks:
      - { header: '${t.links.links}' }
      - text: 'Our YouTube channel'
        href: 'https://www.youtube.com/'
        icon: '${theme.youtubeIcon}'
      - text: 'Find us on social media'
        href: 'pages/links'
        icon: 'fa6-solid:share-nodes'
  footer:
    message: 'Copying allowed only with a link to the source.'
    copyright: 'Copyright © 2026-present Your Name.'
    links:
      - text: '${t.links.aboutBlog}'
        href: 'pages/about'
      - text: 'Contents'
        href: 'pages/contents'
