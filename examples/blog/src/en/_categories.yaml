# yaml-language-server: $schema=../../../../packages/blog/schema/categories.schema.json

# The category registry for this locale — the one place categories are defined.
# Posts reference a category by `id`: `category: getting-started`.
#
# `id` is the same in every locale: it is what ties /en/categories/... to
# /ru/categories/... so the language switcher can follow a category page.
# `slug` defaults to `id`; set it only when you want a different URL.

- id: 'getting-started'
  name: 'Getting Started'

- id: 'configuration'
  name: 'Configuration'

- id: 'writing'
  name: 'Writing'

- id: 'media'
  name: 'Media'

- id: 'seo'
  name: 'SEO'

- id: 'i18n'
  name: 'Internationalization'

- id: 'integration'
  name: 'Integration'

- id: 'advanced'
  name: 'Advanced'

- id: 'neptu-deep'
  name: 'Neptu in Depth'
