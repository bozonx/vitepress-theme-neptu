# yaml-language-server: $schema=../../../packages/blog/schema/site.schema.json

themeConfig:
  home:
    appearance: auto
    maxWidth: 900
    background:
      type: parallax
      image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80'
    sections:
      - { type: featured, enabled: true, limit: 3 }
      - { type: latest, enabled: false }
      - { type: popular, enabled: false }
      - { type: categories, enabled: true, limit: 10 }
      - { type: tags, enabled: true, limit: 15 }
  # Demo only: production blogs normally choose one theme and omit the pickers.
  colorPicker: true
  stylePicker: true
  postList:
    showReadingTime: true
  donate:
    url: 'pages/donate'
  publisher:
    name: 'Neptu'
    url: '${config.siteUrl}'
    logo: '/img/sidebar-logo.webp'
  sidebar:
    logoSrc:
      light: '/img/sidebar-logo-light.webp'
      dark: '/img/sidebar-logo-dark.webp'
    logoHeight: 187
    popular: true
    recent: true
    featured: true
    archive: true
    authors: true
    tags: true
    categories: true
    donate: true
    rssFeed: true
    atomFeed: true
    socialLinks:
      - icon: 'fa6-brands:github'
        link: '${theme.repo}'
  nav:
    donate: true
    socialLinks:
      - icon: 'fa6-brands:github'
        link: '${theme.repo}'
        desktopOnly: true
