# yaml-language-server: $schema=../../node_modules/vitepress-theme-neptu/schema/site.schema.json
# ---------------------------------------------------------------------------
# Level 3 of 3 — per-locale admin configuration.
# Overrides Level 1 (`.vitepress/config.ts`) and Level 2 (`src/site.yaml`)
# for this locale only.
#
# String templates (${...}) are supported — see `src/site.yaml` for the
# full reference. In _site.yaml the `theme` context additionally includes
# values from site.yaml.
# ---------------------------------------------------------------------------

# IETF language tag for this locale, e.g. 'en-US', 'ru-RU', 'pt-BR'.
lang: 'en-US'

# Human-readable language name for the language switcher and the root language
# selector. Built-in languages already have one, so set it only for a language
# the theme does not ship, or to change the wording. Use the endonym.
# label: 'English'

# Canonical site title for this locale: browser tabs, SEO, feeds and the
# sidebar default all use it. Override the sidebar label with
# `themeConfig.sidebar.sidebarTitle`.
title: 'My Neptu Blog'

# Per-page title template. Use ':title' as the placeholder for the page title.
# Set to `false` to disable the suffix entirely.
# titleTemplate: ':title | ${site.title}'

# Site description used for SEO meta tags and RSS/Atom feeds.
description: 'Welcome to my new blog'

# Folder name of another locale whose _site config is inherited as the base;
# current values override the parent. Useful for language variants, e.g.
# `src/en-GB/_site.yaml` with `extends: en-US`.
# extends: en-US

themeConfig:
  # Localized home-page copy. Its layout and section order live in site.yaml.
  home:
    hero:
      title: 'Welcome to My Blog'
      description: 'Thoughts, stories, and ideas built with Neptu Blog Theme'
      # Optional Hero image (recommended size: 320x320 px, transparent WebP/PNG/SVG).
      # Simple string:
      # image: '/img/hero.png'
      # Object with alt text:
      # image: { src: '/img/hero.png', alt: 'Blog Hero Image' }
      # Light & dark theme variants:
      # image:
      #   light: '/img/hero-light.png'
      #   dark: '/img/hero-dark.png'
      #   alt: 'Blog Hero Image'
      actions:
        - text: 'Browse Recent Posts'
          href: 'recent/1'
          # `primary: true` renders the filled accent button.
          primary: true
        - text: 'About Me'
          href: 'pages/about'
          # icon: 'fa6-solid:circle-info'

  # Optional visual sidebar label. Usually omit it and use the locale `title`.
  # sidebar:
  #   sidebarTitle: 'My Neptu Blog'

  # -------------------------------------------------------------------------
  # Fine-grained overrides
  #
  # Every themeConfig key from `src/site.yaml` can be overridden here for this
  # locale only, including your own custom fields. Objects deep-merge, so list
  # just the sub-keys that differ; arrays replace, so an array override must be
  # complete. Prefer the shared layer for site-wide behavior and override here
  # only when this locale intentionally differs.
  #
  #   postList:
  #     showPreview: false      # only this sub-key changes
  #   postFooter:               # arrays replace — list every wanted block
  #     - author
  #     - tags
  #     - social-share
  # -------------------------------------------------------------------------

  # Locale-specific UI labels (override built-in defaults per locale):
  # sidebarMenuLabel: 'Menu'           # mobile sidebar toggle / aria-label
  # colorThemeMenuLabel: 'Theme'       # color theme switcher tooltip
  # langMenuLabel: 'Interface language'  # language switcher tooltip
  # stylePresetMenuLabel: 'Style'      # style preset switcher tooltip
  # returnToTopLabel: 'Back to top'    # "back to top" button text
  # lightModeSwitchTitle: 'Switch to light theme'
  # darkModeSwitchTitle: 'Switch to dark theme'
  # notFound:
  #   title: 'Page not found'
  #   linkText: 'Take me home'

  # --- Edit Link -------------------------------------------------------------
  editLink:
    # Auto-derived from `themeConfig.repo`; set it only for a custom layout.
    # pattern: "https://github.com/your-username/my-blog/edit/main/src/:path"
    text: 'Edit this page on GitHub'

  # -------------------------------------------------------------------------
  # Donate button — rendered only when nav.donate and/or sidebar.donate is true.
  # Relative URLs are automatically prefixed with the current locale.
  # -------------------------------------------------------------------------
  donate:
    # url: "pages/donate"
    postDonateCall: 'If you find this blog helpful, consider supporting it!'
    # icon: "${theme.donateIcon}"  # override the default heart icon

  # -------------------------------------------------------------------------
  # Publisher info — used in the auto-generated JSON-LD for every page.
  # Defined in src/site.yaml; override here for a localized name or logo.
  # -------------------------------------------------------------------------
  # publisher:
  #   name: 'My Blog'
  #   logo: '/img/logo.png'

  # Authors live in the sibling `_authors.yaml` file (merged by `id`).
  # You can also declare them inline here under `authors:` — both sources are
  # merged by id, with `_authors.yaml` winning on conflicts.

  # -------------------------------------------------------------------------
  # Social sharing buttons in the post footer.
  #
  # Every locale ships a default set (Telegram, WhatsApp, VK, X, Facebook,
  # LinkedIn for `en`). Entries here are MERGED with those defaults by `name`:
  # a matching name overrides fields on the built-in button, a new name is
  # appended, and `enabled: false` hides a built-in one.
  #
  # Note: `socialMediaShares: []` does NOT hide the block — an empty list means
  # "nothing to merge". To remove the block, drop `social-share` from
  # `postFooter` in src/site.yaml.
  #
  # {url} and {title} are replaced with the current page URL and title.
  # -------------------------------------------------------------------------
  # socialMediaShares:
  #   # Restyle a built-in button
  #   - name: x
  #     icon: "fa6-brands:x-twitter"
  #     title: "Share on X"
  #   # Add a new one
  #   - name: reddit
  #     icon: "fa6-brands:reddit"
  #     title: "Share on Reddit"
  #     urlTemplate: "https://www.reddit.com/submit?url={url}&title={title}"
  #     class: "custom-share-button"
  #   # Hide a built-in one
  #   - name: vk
  #     enabled: false

  # -------------------------------------------------------------------------
  # Top bar
  # -------------------------------------------------------------------------
  nav:
    # Show the donate button in the top bar.
    # donate: true
    links:
      - text: 'About'
        href: 'pages/about'
        # Iconify string: "<prefix>:<icon-name>". Browse at https://icon-sets.iconify.design/
        icon: 'solar:document-linear'
        # iconClass: 'muted'
        # class: 'custom-nav-link'
        # desktopOnly: true
        # mobileOnly: true   # show only on mobile (where sidebar is hidden)
      # - text: "${t.links.donate}"
      #   href: "pages/donate"
      #   icon: "${theme.donateIcon}"
      #   # iconClass: 'muted'
      #   # class: 'custom-nav-link'
      #   # mobileOnly: true   # show only on mobile (where sidebar is hidden)
    # socialLinks:
    #   - icon: 'fa6-brands:github-alt'
    #     link: '${theme.repo}'
    #     # url: "https://github.com/"  # alternative to link
    #     # class: "custom-social-link"
    #     # iconClass: "text-xl"
    #     desktopOnly: true
    #     # mobileOnly: false

  # -------------------------------------------------------------------------
  # Sidebar
  # -------------------------------------------------------------------------
  sidebar:
    # sidebarTitle: false  # Set false to hide the blog title below the logo, or a string to override it.
    # popular: true # Show popular posts section. Requires popularPosts.enabled.
    # recent: true # Show recent posts section.
    # featured: true # Show the "Featured" section (posts with `featured: true`).
    # archive: true # Show archive (by year) section.
    # authors: true # Show authors section.
    # tags: true # Show tags cloud.
    # categories: true # Show categories cloud.
    # donate: true # Show donate button at the bottom.
    # rssFeed: true # Show RSS feed link.
    # atomFeed: true # Show Atom feed link.
    # links:
    #   - text: "${t.links.recent}"
    #     href: "recent/1"
    #     icon: "${theme.recentIcon}"
    #     # iconClass: 'muted'
    #     # class: 'custom-sidebar-link'
    #     # desktopOnly: false
    #     # mobileOnly: false
    bottomLinks:
      - { header: '${t.links.links}' }
      - text: 'About'
        href: 'pages/about'
        icon: 'mdi:information-outline'
        # iconClass: 'muted'
        # class: 'custom-bottom-link'
        # desktopOnly: false
        # mobileOnly: false
    # socialLinks:
    #   - icon: 'fa6-brands:github-alt'
    #     link: '${theme.repo}'
    #     # class: 'custom-social-link'
    #     # iconClass: 'text-xl'
    #     # desktopOnly: false
    #     # mobileOnly: false

  # -------------------------------------------------------------------------
  # Footer
  # -------------------------------------------------------------------------
  footer:
    message: 'Built with Neptu Blog Theme & VitePress.'
    copyright: 'Copyright © 2026'
    # Icon links in the footer. Both default to false.
    # rssFeed: true
    # atomFeed: true
    # Social links shown in the footer (same format as sidebar.socialLinks).
    # socialLinks:
    #   - icon: 'fa6-brands:github'
    #     link: '${theme.repo}'
    #     title: 'GitHub'
    links:
      - text: '${t.links.aboutBlog}'
        href: 'pages/about'
        # icon: "mdi:information-outline"
        # iconClass: "muted"
        # class: "custom-footer-link"
        # mobileOnly: false
        # desktopOnly: false

  # --- Authors ---------------------------------------------------------------
  # List of blog authors. Each author must have a unique `id` and a `name`.
  # Authors are merged by-id across locale files.
  # authors:
  #   - id: jane-doe
  #     name: Jane Doe
  #     image: /authors/jane-banner.jpg
  #     imageWidth: 400
  #     imageHeight: 200
  #     description: Tech writer and open-source enthusiast.
  #     twitterHandle: janedoe
  #     links:
  #       - type: twitter
  #         url: https://twitter.com/janedoe
  #         title: Jane on Twitter

  # -------------------------------------------------------------------------
  # Translations — overrides built-in `t` strings for this locale only.
  # The theme ships multilanguage defaults in `blogLocalesBase/<lang>.ts`;
  # only the keys you list here are overridden. The complete key reference is
  # in the Level-2 `src/site.yaml` translation section and in site.schema.json.
  # -------------------------------------------------------------------------
  # t:
  #   popularPosts: "Popular Posts"
  #   similarPosts: "Similar Posts"
  #   shareSocialMedia: "Share on Social Media"
  #   viewInAnotherLanguage: "Read this page in another language"
  #   links:
  #     aboutBlog: "About This Blog"
  #     donate: "Donate"
