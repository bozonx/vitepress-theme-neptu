# yaml-language-server: $schema=../node_modules/vitepress-theme-neptu/schema/site.schema.json

# ============================================================================
# Neptu Blog — Shared Site Configuration (site.yaml)
#
# Level 2 of 3 — cross-locale admin configuration. Applied to every locale and
# sits between developer `config.ts` and per-locale `_site.yaml` files:
#
#   built-in theme defaults  →  built-in content-locale defaults
#     →  config.ts  →  src/site.yaml  →  src/<locale>/_site.yaml
#
# Use this file only for safe, presentation/content settings that are the SAME
# for every locale. Do not put JavaScript, environment variables, VitePress
# build options, plugins, hooks, `base`, `srcDir`, or `siteUrl` here: those
# are Level 1 (`.vitepress/config.ts`) settings.
# ============================================================================


# --- Template Substitution -------------------------------------------------
# Any string value in this file (and in _site.yaml) supports ${...}
# substitution applied to the raw YAML text before parsing.
#
# Context keys available in site.yaml:
#   config       — BlogUserConfig from config.ts
#   theme        — merged themeConfig (built-ins + config.ts)
#   t            — translation keys from merged theme
#   localeIndex  — current locale key (e.g. "en", "ru")
#
# In _site.yaml the `theme` context additionally includes values
# from site.yaml, so cross-references between layers work there.
#
# Dot-notation is supported: ${theme.publisher.url}, ${config.siteUrl}
# Example:
#   publisher:
#     url: ${config.siteUrl}
#     logo: ${config.siteUrl}/img/logo.png


# ============================================================================
# Theme Configuration
# ============================================================================
themeConfig:

  # --- General ---------------------------------------------------------------
  # Show an external-link icon next to outbound links.
  # Default: true
  externalLinkIcon: true

  # Color theme and shape preset applied to first-time visitors.
  # Colors: blue | green | purple | amber | teal | rose | magenta | monochrome
  # Styles: soft | sharp | brutal | glass | editorial | mono
  # Both also accept the id of a preset you define in .vitepress/theme/styles.css.
  # defaultColorTheme: 'blue'
  # defaultStylePreset: 'soft'

  # Let readers switch the theme themselves. Both default to false — a site
  # normally ships one chosen theme and these are demo controls.
  # colorPicker: true
  # stylePicker: true

  # When true, routes users to their-language version of a page if available.
  # Default: true
  # i18nRouting: false

  # --- Locale home page -----------------------------------------------------
  # The locale index.md only needs `layout: home`; content comes from here and
  # from the locale's _site.yaml. Omitted section limits show one `perPage` page.
  home:
    # auto follows the visitor's light/dark preference and shows the switch.
    # light or dark forces that appearance on the home page and hides the switch.
    appearance: auto # auto | light | dark
    maxWidth: 800
    background: none # none | parallax
    # backgroundImage: /img/home.jpg
    # bgParallaxOffset: 300
    # Global hero defaults. The wording is per-locale, so `hero.title` and
    # `hero.description` normally live in `<locale>/_site.yaml`.
    # Recommended image size: 320x320 px (transparent WebP/PNG/SVG).
    # `image` accepts a string, `{ src, alt }`, `{ light, dark, alt }`, or
    # `{ src: { light, dark }, alt }`:
    # hero:
    #   image:
    #     light: '/img/hero-light.png'
    #     dark: '/img/hero-dark.png'
    #     alt: 'Blog Hero'
    # Sections listed below are rendered in this order. A section whose page
    # folder you deleted must be disabled here too (see README, "Trim what you
    # don't need").
    sections:
      - type: featured
        enabled: true
        # limit: 3
      - type: latest
        enabled: false
        # limit: 15
      - type: popular
        enabled: false
        # limit: 15
      - type: tags
        enabled: true
        # limit: 15
      - type: categories
        enabled: true
        # limit: 10

  # `repo` is deliberately configured in .vitepress/config.ts: it describes
  # source-control layout and supplies edit-link URLs.

  # Optional visual sidebar title. The canonical browser/SEO/feed title is the
  # top-level `title` in each locale's _site.yaml. Override per-sidebar with
  # `sidebar.blogTitle`, or set it to `false` to hide.
  # Default: falls back to locale `title`
  # blogTitle: My Blog

  # Twitter/X @handle (without @) for SEO meta tags.
  # Default: none
  # twitterSite: myblog

  # --- Sidebar ---------------------------------------------------------------
  # Sidebar sections and links configuration.
  # All boolean flags below default to false (hidden) when not specified.
  sidebar:
    # Logo image URL shown at the top of the sidebar.
    # Use a raster image (PNG/WebP) with a fixed resolution; the <img> element
    # renders at width=320 × logoHeight px, so a 2× source (640×360) is
    # recommended for retina displays.
    # Add an image to `src/public/` first, then point to it from the public root.
    # A single string is used for both light and dark appearances:
    # logoSrc: /img/sidebar-logo.webp
    # For separate light/dark logos, use an object with `light` and `dark` keys
    # (an optional `alt` adds accessible alt text):
    # logoSrc:
    #   light: /img/sidebar-logo-light.webp
    #   dark: /img/sidebar-logo-dark.webp
    #   alt: My Blog
    # Default: none (no logo)

    # Logo height in pixels — used only as a placeholder so the browser can
    # reserve vertical space before the image loads (prevents layout shift / CLS).
    # The image is NOT compressed to this height: CSS `h-auto` keeps the natural
    # aspect ratio. Set this to the image's height at 320px render width
    # (e.g. for a 640×360 source, use 180).
    # Default: 158
    # logoHeight: 180

    # Show the "Recent posts" section.
    recent: true
    # Show the "Featured" section — posts with `featured: true` in frontmatter.
    # They also get their own list page at /<locale>/featured/1.
    featured: true
    # Show the "Popular posts" section (requires popularPosts.enabled).
    popular: false
    # Show the "Archive" (by year) section.
    archive: true
    # Show the "Authors" section.
    authors: true
    # Show the "Tags" cloud section.
    tags: true
    # Show the "Categories" cloud section.
    # Default: false
    categories: true
    # Show a donate link/button in the sidebar.
    donate: true
    # Show an RSS feed link.
    rssFeed: true
    # Show an Atom feed link.
    atomFeed: true
    # Override the sidebar title. Defaults to `blogTitle`, then locale `title`.
    # Set `false` to hide.
    # Default: falls back to `blogTitle`, then locale `title`
    # blogTitle: My Blog
    # Custom navigation links shown at the top of the sidebar.
    # links:
    #   - text: Home
    #     href: /
    #     icon: 'fa6-solid:house'
    # Custom navigation links shown at the bottom of the sidebar.
    # bottomLinks:
    #   - text: Privacy
    #     href: /privacy
    # Social links shown in the sidebar.
    socialLinks:
      - icon: 'fa6-brands:github'
        link: '${theme.repo}'

  # --- Navigation Bar --------------------------------------------------------
  nav:
    # Show a donate button in the navbar.
    # Default: false
    donate: true
    # Custom navigation links shown in the navbar.
    # links:
    #   - text: About
    #     href: /about
    #     icon: 'fa6-solid:circle-info'
    # Social links shown in the navbar.
    socialLinks:
      - icon: 'fa6-brands:github'
        link: '${theme.repo}'
        # Show this link only on desktop (hidden on mobile).
        desktopOnly: true

  # --- Donate ----------------------------------------------------------------
  donate:
    # URL of the donate page (relative to site root).
    # Default: none (required if donate is shown)
    url: 'page/donate'
    # Override the donate icon (Iconify name).
    # Default: 'fa6-solid:hand-holding-heart' (falls back to `donateIcon`)
    # icon: 'fa6-solid:hand-holding-heart'
    # Call-to-action text shown after the donate block on post pages.
    # Default: none (block is hidden when not set)
    # postDonateCall: 'If you found this post useful, consider supporting.'

  # --- Edit Link -------------------------------------------------------------
  # VitePress built-in: adds an "Edit this page" link on post pages.
  # The pattern is auto-generated from `repo` in .vitepress/config.ts and
  # supports GitHub, GitLab, Bitbucket, Gitea, Forgejo and Codeberg, assuming
  # branch `main` and content in `src/`. Uncomment only to override it.
  # editLink:
  #   # Default: auto-generated from `repo`
  #   pattern: 'https://github.com/your-username/my-blog/edit/main/src/:path'
  #   # Default: the i18n translation key `editLink`
  #   text: Edit this page

  # --- Post List Card --------------------------------------------------------
  # Controls what is shown on each post card in list/archive/tag views.
  # Visual-content flags default to true; reading time defaults to false.
  postList:
    showDate: true
    showTags: true
    showThumbnail: true
    showPreview: true
    showAuthor: true
    # Show the compact reading-time estimate next to the card metadata.
    # Default: false
    showReadingTime: false
    # Maximum number of characters for the post preview text.
    # Default: 300
    maxPreviewLength: 300

  # --- Reading Time ---------------------------------------------------------
  # Estimate article length from the Markdown source at build time. The post
  # header displays it by default; list cards use `showReadingTime` above.
  readingTime:
    enabled: true
    # Average reading speed in words per minute.
    wpm: 200
    # Layouts whose page header displays the estimate.
    layouts: ['post']

  # --- Drafts ----------------------------------------------------------------
  # `draft: true` in a post's frontmatter hides it from lists, feeds, sitemap
  # and search, and marks the page `noindex` — but the page still builds and
  # stays reachable by direct link, so it can be proofread "as in production".
  # drafts:
  #   # Show drafts in listings. Defaults to true in `dev`, false in `build`,
  #   # so drafts are visible while writing and cannot ship by accident.
  #   showDrafts: false

  # --- Post Footer Blocks ----------------------------------------------------
  # Ordered list of post-footer blocks. Supported keys:
  #   'author', 'donate', 'comments', 'social-share', 'edit-link',
  #   'categories', 'tags', 'navigation', 'similar', 'popular-link'.
  # Omit a key to hide the block; reorder to change layout.
  # The default is every key in the order above; the list below drops
  # 'popular-link'. Arrays replace (never merge) across config layers, so a
  # locale override must list every block it wants.
  postFooter:
    - author
    - donate
    - comments
    - social-share
    - edit-link
    - categories
    - tags
    - navigation
    - similar

  # --- Pagination & Listing --------------------------------------------------
  # `perPage` is a build-time parameter — configure it in `.vitepress/config.ts`
  # (exported as `PER_PAGE`) because path generators (`*.paths.js`) import it
  # at build time to compute pagination routes.

  # Maximum number of tags shown in the sidebar tag cloud.
  # Default: 15
  # sidebarTagsCount: 15

  # Maximum number of categories shown in the sidebar category cloud.
  # Beyond this count a "view all categories" link is shown instead.
  # Default: 10
  # sidebarCategoriesCount: 10

  # Number of similar posts to display in the post-footer "similar" block.
  # Default: 5
  # similarPostsCount: 5

  # Maximum number of pagination items shown at once.
  # Default: 5
  # paginationMaxItems: 5

  # --- Footer ----------------------------------------------------------------
  # `message`, `copyright` and `links` are wording, so they live per-locale in
  # `<locale>/_site.yaml`. Put only the shared icon toggles here.
  # footer:
  #   # All three default to false.
  #   rssFeed: true
  #   atomFeed: true
  #   github: true   # uses `repo` from .vitepress/config.ts

  # --- Icons -----------------------------------------------------------------
  # Override any sidebar/nav icon with an Iconify icon name.
  # donateIcon: 'fa6-solid:hand-holding-heart'
  # recentIcon: 'fa6-solid:bolt'
  # featuredIcon: 'fa6-solid:certificate'
  # popularIcon: 'fa6-solid:star'
  # byDateIcon: 'fa6-solid:calendar-days'
  # authorsIcon: 'mdi:users'
  # rssIcon: 'bi:rss-fill'
  # atomIcon: 'vscode-icons:file-type-atom'
  # youtubeIcon: 'fa6-brands:youtube'
  # tagsIcon: 'fa6-solid:tag'
  # categoriesIcon: 'fa6-solid:folder-open'

  # --- Publisher (JSON-LD / SEO) ---------------------------------------------
  # Publisher info used in JSON-LD structured data.
  publisher:
    name: My Blog
    # String values support ${...} template substitution.
    # Available context: config (BlogUserConfig), theme (merged themeConfig),
    # t (translations), localeIndex.
    # Example: url: ${config.siteUrl}
    url: https://example.com
    # Set this only after adding the corresponding public image, for example:
    # logo: /img/logo.png

  # --- Social Media Share Buttons --------------------------------------------
  # Sharing platforms rendered in the post-footer "social-share" block.
  # `urlTemplate` must contain `{url}` and optionally `{title}` placeholders.
  #
  # Built-in buttons are defined per-locale (e.g. Telegram, WhatsApp, VK, X,
  # Facebook, LinkedIn for `en`). Entries here are **merged by `name`** with
  # the built-in list — you can override fields on existing buttons or add
  # new ones. Set `enabled: false` to hide a built-in button without
  # removing it from the defaults.
  #
  # socialMediaShares:
  #   # Override the icon/title on a built-in button
  #   - name: x
  #     icon: 'fa6-brands:x-twitter'
  #     title: Share on X
  #     urlTemplate: 'https://twitter.com/intent/tweet?url={url}&text={title}'
  #   # Add a new button
  #   - name: reddit
  #     icon: 'fa6-brands:reddit'
  #     title: Share on Reddit
  #     urlTemplate: 'https://www.reddit.com/submit?url={url}&title={title}'
  #   # Disable a built-in button
  #   - name: vk
  #     enabled: false

  # --- Feeds (RSS / Atom / JSON) ---------------------------------------------
  # feeds:
  #   # Maximum number of posts included in generated feeds.
  #   # Default: 50
  #   maxPosts: 50
  #   # Feed formats to generate. Supported: 'rss', 'atom', 'json'.
  #   # Default: ['rss', 'atom', 'json']
  #   formats:
  #     - rss
  #     - atom
  #     - json
  #   # Include safe rendered article HTML in each feed item. Relative links
  #   # and images become absolute. Default: false (description/preview only).
  #   fullContent: false

  # --- SEO -------------------------------------------------------------------
  # All boolean flags below default to true.
  # seo:
  #   # Generate Open Graph meta tags.
  #   og: true
  #   # Generate JSON-LD structured data.
  #   jsonLd: true
  #   # Generate hreflang alternate-language link tags.
  #   hreflang: true
  #   # Generate canonical link tags.
  #   canonical: true
  #   # Auto-generate canonical URLs from the page path.
  #   autoCanonical: true
  #   # Add RSS/Atom feed <link> tags to <head>.
  #   rss: true
  #   # Maximum description length for meta tags (truncated if exceeded).
  #   # Default: 300
  #   maxDescriptionLength: 300

  # --- i18n Translations ----------------------------------------------------
  # Partial overrides of the built-in UI strings, deep-merged over the locale
  # defaults — supply only the keys you change. Wording that differs per
  # language belongs in `<locale>/_site.yaml`; keep this file for keys that are
  # identical everywhere (e.g. a single-language blog).
  #
  # The schema hint at the top of this file gives editor autocomplete for every
  # key. Nested groups: `links`, `months`, `podcasts`, `audioFile`, `videoFile`,
  # `fileDownload`, `lightbox`.
  # t:
  #   popularPosts: Popular
  #   similarPosts: You may also like
  #   # Plural forms: 2 for English-like, 3 for Russian-like languages.
  #   postsCountForms: [post, posts]
  #   links:
  #     aboutBlog: About this blog

  # --- Custom Fields ---------------------------------------------------------
  # You can add any own fields to `themeConfig` — they are preserved through
  # the merge pipeline and accessible at runtime via `useUiTheme()` in your
  # Vue components. Objects are deep-merged across layers; arrays replace.
  #
  # Example:
  #   myCustomField: "hello"
  #   myCustomConfig:
  #     featureEnabled: true
  #     apiUrl: "https://api.example.com"
  #
  # Access in a component:
  #   const { theme } = useUiTheme()
  #   console.log(theme.value.myCustomField)        // "hello"
  #   console.log(theme.value.myCustomConfig)       // { featureEnabled: true, ... }
